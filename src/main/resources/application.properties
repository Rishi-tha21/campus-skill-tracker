# ==============================================
# DATABASE CONFIGURATION
# ==============================================
# H2 In-Memory Database (Default - No installation needed)
spring.datasource.url=jdbc:h2:mem:campus_skill_tracker;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL Configuration (Uncomment below and comment out H2 above to use MySQL)
# spring.datasource.url=jdbc:mysql://localhost:3306/campus_skill_tracker?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==============================================
# JPA / HIBERNATE CONFIGURATION
# ==============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Run data.sql AFTER JPA creates the schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ==============================================
# MVC VIEW CONFIGURATION (JSP)
# ==============================================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ==============================================
# LOGGING
# ==============================================
logging.level.org.springframework=INFO
logging.level.com.campus=DEBUG
